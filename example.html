<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星辰笔记 · 产品发布页</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #1a1d27;
      --muted: #6b7280;
      --brand: #4f46e5;
      --brand-soft: #eef2ff;
      --accent: #0ea5e9;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    .hero {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      padding: 72px 24px;
      text-align: center;
    }
    .hero h1 { margin: 0 0 12px; font-size: 40px; letter-spacing: 0.5px; }
    .hero p { margin: 0 auto; max-width: 560px; font-size: 18px; opacity: 0.92; }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
    .section-title { font-size: 24px; margin: 40px 0 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card h3 { margin: 0 0 8px; font-size: 17px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .features { margin: 0; padding: 0; list-style: none; }
    .features li {
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .cta {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      margin-top: 24px;
    }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px; }
  </style>
</head>
<body>
  <header class="hero">
    <span class="badge">v2.0 现已发布</span>
    <h1>星辰笔记</h1>
    <p>把灵感、待办与知识沉淀在一处。离线可用，隐私优先，支持 Markdown 与全文搜索。</p>
  </header>

  <main class="wrap">
    <h2 class="section-title">为什么选择星辰笔记</h2>
    <div class="cards">
      <div class="card">
        <h3>极速启动</h3>
        <p>本地优先架构，打开即用，不依赖网络。</p>
      </div>
      <div class="card">
        <h3>双向链接</h3>
        <p>用 [[双链]] 把零散的想法织成知识网络。</p>
      </div>
      <div class="card">
        <h3>全文搜索</h3>
        <p>毫秒级定位任意一条笔记，支持中英文。</p>
      </div>
    </div>

    <h2 class="section-title">核心功能</h2>
    <ul class="features">
      <li><strong>Markdown 编辑器</strong> — 所见即所得，实时预览。</li>
      <li><strong>标签与看板</strong> — 自由组织任务与项目。</li>
      <li><strong>端到端加密</strong> — 数据只属于你自己。</li>
    </ul>

    <a class="cta" href="#">立即下载</a>
  </main>

  <footer>© 2026 星辰笔记团队 · 保留所有权利</footer>
</body>
</html>
