      function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#pane-edit').hidden=tab!=='edit';$('#pane-notes').hidden=tab!=='notes'}
      function cleanHtml(){const clone=doc.documentElement.cloneNode(true);clone.querySelector('#anno-review-style')?.remove();clone.querySelectorAll('.anno-review-ui').forEach(el=>el.remove());clone.querySelector('body')?.removeAttribute('data-review-mode');clone.querySelector('body')?.classList.remove('anno-drawing');clone.querySelectorAll('[data-review-key]').forEach(el=>{el.removeAttribute('data-review-key');el.removeAttribute('data-review-original');el.removeAttribute('data-review-selected');el.removeAttribute('contenteditable');el.removeAttribute('spellcheck')});clone.querySelectorAll('[data-slide]').forEach(el=>{el.removeAttribute('inert');el.removeAttribute('aria-hidden');el.removeAttribute('aria-current')});const dt=doc.doctype?`<!DOCTYPE ${doc.doctype.name}>\n`:'<!doctype html>\n';return dt+clone.outerHTML}
      function handoffPrompt(handoffId){return [`Anno 修订已提交，请接管会话 ${SESSION_ID}（handoff ${handoffId}）。`,`第一步必须调用 html_review_claim_handoff，参数为 session_id=${SESSION_ID}、handoff_id=${handoffId}，让 Anno 获得真实接收回执。`,'然后调用 html_review_get_session 重新载入完整会话，以 draft HTML 为基础应用所有未解决标注和页注；不要覆盖源文件。','生成并验证最终 standalone HTML 后，调用 html_review_register_final 登记，并在当前对话提供可点击产出物。'].join('\n')}
      async function notifyHost(handoffId){const host=window.openai||{};for(const launch of [host.sendFollowUpMessage,host.openCodexPrompt]){if(typeof launch!=='function')continue;try{await launch.call(host,{prompt:handoffPrompt(handoffId),originUrl:location.href,scrollToBottom:true});return true}catch{}}return false}
      function restoreHandoffStatus(session){const handoff=session?.handoff;if(!handoff?.id)return;const result=$('#result'),button=$('#generate');result.classList.add('show');button.textContent=t('handoffAgain');if(handoff.status==='resolved')result.textContent=t('resolved');else if(handoff.status==='claimed')result.textContent=t('claimed');else if(handoff.status==='sent')result.textContent=t('sentToCodex');else if(handoff.status==='dispatching')result.textContent=t('dispatching');else if(handoff.status==='retrying')result.textContent=t('retrying',{error:handoff.last_error?`: ${handoff.last_error}`:''});else result.textContent=t('connectingCodex');if(!['resolved','claimed'].includes(handoff.status))void monitorHandoff(handoff.id)}
      async function monitorHandoff(handoffId){const result=$('#result'),button=$('#generate');for(let attempt=0;attempt<300;attempt++){await new Promise(resolve=>setTimeout(resolve,1000));try{const data=await api(),handoff=data.session?.handoff;if(!handoff||handoff.id!==handoffId)return;if(handoff.status==='claimed'){result.textContent=t('claimed');toast(t('claimedToast'));return}if(handoff.status==='resolved'){result.textContent=t('resolved');toast(t('resolvedToast'));return}if(handoff.status==='sent'){result.textContent=t('sentToCodex')}else if(handoff.status==='dispatching'){result.textContent=t('dispatching')}else if(handoff.status==='retrying'){result.textContent=t('retrying',{error:handoff.last_error?`: ${handoff.last_error}`:''})}else{result.textContent=t('connectingCodex')}button.textContent=t('handoffAgain')}catch{result.textContent=t('receiptUnavailable')}}}
      async function generate(){const button=$('#generate'),result=$('#result');button.disabled=true;button.textContent=t('submitting');try{await save(false);const generation=await api('/generate',authed({html:cleanHtml(),review:state})),handoffId=generation.session?.handoff?.id;if(!handoffId)throw new Error(t('noHandoffId'));result.textContent=t('connectingCodex');result.classList.add('show');toast(t('submitted'));const notified=await notifyHost(handoffId);if(notified){await api('/handoff-sent',authed({handoff_id:handoffId}));result.textContent=t('sentToCodex')}else{const fallback=await api('/handoff-dispatch',authed({handoff_id:handoffId}));result.textContent=fallback.dispatch_requested?t('dispatching'):t('manualHandoff',{session:SESSION_ID})}void monitorHandoff(handoffId)}catch(e){result.textContent=t('submitFailed',{error:e.message});result.classList.add('show');toast(e.message)}finally{button.disabled=false;button.textContent=t('handoffAgain')}}

      const stateReady=api().then(data=>{
        const review=data.review||{};
        state={
          edits:review.edits||{},
          formatChanges:review.formatChanges||{},
          annotations:review.annotations||[],
          pageNotes:review.pageNotes||{},
          changeSequence:review.changeSequence||{},
          nextSequence:review.nextSequence||1,
          activePage:review.activePage||1
        };
        updateSaveState(t('connected'));
        restoreHandoffStatus(data.session);
      }).catch(e=>{updateSaveState(t('connectionFailed'));toast(e.message)});
      frame.addEventListener('load',()=>stateReady.finally(setup),{once:true});
      document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>applyMode(b.dataset.mode)));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));$('#language').addEventListener('change',event=>applyLanguage(event.target.value));$('#language-toggle').addEventListener('click',()=>applyLanguage(currentLanguage==='zh-CN'?'en':'zh-CN'));$('#theme-toggle').addEventListener('click',()=>applyTheme(currentTheme==='dark'?'light':'dark'));
      fields.fontSize.addEventListener('input',()=>{paintRange(fields.fontSize);rangeOutput.fontSize.textContent=`${fields.fontSize.value} px`;recordFormat('element','fontSize',`${fields.fontSize.value}px`)});fields.lineHeight.addEventListener('input',()=>{paintRange(fields.lineHeight);rangeOutput.lineHeight.textContent=`${Number(fields.lineHeight.value).toFixed(2)}×`;recordFormat('element','lineHeight',fields.lineHeight.value)});
      document.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>{const [id,direction]=button.dataset.step.split(':'),input=$(`#${id}`);Number(direction)>0?input.stepUp():input.stepDown();input.dispatchEvent(new Event('input',{bubbles:true}))}));
      document.querySelectorAll('[data-weight]').forEach(button=>button.addEventListener('click',()=>{fields.fontWeight.value=button.dataset.weight;setPressed('[data-weight]',fields.fontWeight.value);recordFormat('element','fontWeight',fields.fontWeight.value)}));document.querySelectorAll('[data-align]').forEach(button=>button.addEventListener('click',()=>{fields.textAlign.value=button.dataset.align;setPressed('[data-align]',fields.textAlign.value);recordFormat('element','textAlign',fields.textAlign.value)}));
      fields.color.addEventListener('input',()=>{syncColor(fields.color.value);recordFormat('element','color',fields.color.value)});
      pageNote.addEventListener('input',()=>{state.pageNotes[String(activePage+1)]=pageNote.value;scheduleSave()});
      $('#undo').addEventListener('click',()=>history('undo'));$('#redo').addEventListener('click',()=>history('redo'));$('#save-now').addEventListener('click',()=>save(true));$('#generate').addEventListener('click',generate);document.addEventListener('keydown',event=>{if(!(event.metaKey||event.ctrlKey)||event.key.toLowerCase()!=='z')return;event.preventDefault();history(event.shiftKey?'redo':'undo')});applyLanguage(currentLanguage);updateUndo();setDisabled(true);
    })();
  </script>
</body>
</html>
